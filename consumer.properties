# IBM MQ Consumer Configuration
# ---------------------------------------------------------------------------

# CCDT file URL — points to the JSON CCDT that describes the MQ channel(s)
# Use a file:// URL on Windows, e.g. file:///C:/MQ/ccdt.json
mq.ccdtUrl=file:///C:/MQ/ccdt.json

# Queue manager name to connect to
mq.queueManager=QM1

# Destination queue to consume messages from
mq.queue=DEV.QUEUE.1

# Number of consumer threads to start (each gets its own JMS connection)
consumer.threads=3

# Seconds a consumer thread waits for a message before exiting
# When receive() returns null (timeout), the thread closes its connection and stops
consumer.timeoutSeconds=30

# Path to the output log file (relative or absolute)
log.file=mqconsumer.log

# ---------------------------------------------------------------------------
# Reconnect options (automatic client reconnect)
# ---------------------------------------------------------------------------

# Reconnect option — controls which queue managers the client may reconnect to.
# ANY  : reconnect to any queue manager in the CCDT (recommended)
# QMGR : reconnect to the same queue manager only
# NO   : disable automatic reconnect
mq.reconnectOption=ANY

# Total number of seconds the client will keep retrying before giving up.
# Set to -1 to retry indefinitely.
mq.reconnectCount=600

# Approximate delay in seconds between individual reconnect attempts.
# (Informational — the MQ client controls the exact back-off interval.)
mq.reconnectDelaySeconds=5

# ---------------------------------------------------------------------------
# CCSID
# ---------------------------------------------------------------------------

# Character set identifier used for message encoding.
# 1208 = UTF-8  (recommended for all new applications)
mq.ccsid=1208
